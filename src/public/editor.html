<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="stylesheet" href="js/vendor/prism/1.29.0/themes/prism.min.css">
    <link rel="stylesheet" href="js/vendor/katex/0.16.9/katex.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/editor.css">
    <style>
        /* 编辑器页面的最小增量样式，复用主站设计变量 */
        .editor-container { display: flex; height: 100vh; }
        .editor-toolbar { padding: 0.5rem 1rem; border-bottom: 1px solid var(--border-color); background: var(--bg-secondary); display:flex; justify-content: space-between; align-items:center; }
        .editor-actions { display:flex; gap:0.5rem; align-items:center; }
        .edit-btn-group { display:flex; gap:4px; }
        .editor-main { flex:1; display:flex; min-height:0; }
        .editor-pane { flex:1; display:flex; flex-direction:column; min-height:0; }
        .editor-pane.left { border-right: 1px solid var(--border-color); min-height:0; }
        .editor-textarea { flex:1; width:100%; padding:1rem; border:none; outline:none; font-family: Menlo, Monaco, Consolas, "Courier New", monospace; font-size:14px; background: var(--bg-primary); color: var(--text-primary); min-height:0; overflow:auto; }
        .preview-pane { flex:1; display:flex; flex-direction:column; min-height:0; }
        .preview-body { flex:1; overflow-y:auto; padding:1rem; background: var(--bg-primary); min-height:0; }
        .preview-body .active-preview-heading {
            background: var(--hover-color, rgba(0, 123, 255, 0.12));
            box-shadow: inset 3px 0 0 var(--accent-color, #007bff);
            border-radius: 4px;
            padding-left: 0.5rem;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .status-bar { padding:0.25rem 1rem; font-size:0.875rem; color: var(--text-secondary); border-top:1px solid var(--border-color); background: var(--bg-secondary); }
        .split-title { padding:0.5rem 1rem; border-bottom:1px solid var(--border-color); font-size:0.875rem; color: var(--text-secondary); background: var(--bg-secondary); }
        .hidden { display:none; }
        @media (max-width: 768px) { .editor-main { flex-direction: column; } .editor-pane.left { border-right:none; border-bottom: 1px solid var(--border-color); } }

        /* Save As 弹窗 */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display:none; align-items:center; justify-content:center; z-index: 1000; }
        .modal { width: 720px; max-width: 95vw; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .modal-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        .modal-body { display:flex; gap:12px; padding: 0.75rem 1rem; }
        .modal-footer { display:flex; justify-content:flex-end; gap:8px; padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); }
        .tree-pane { flex: 1 1 60%; border: 1px solid var(--border-color); border-radius:6px; padding:8px; max-height: 50vh; overflow:auto; }
        .form-pane { flex: 1 1 40%; display:flex; flex-direction:column; gap:8px; }
        .form-pane input { padding:8px; border:1px solid var(--border-color); border-radius:4px; background: var(--bg-primary); color: var(--text-primary); }
        .tree-item { cursor: pointer; padding:4px 6px; border-radius:4px; }
        .tree-item:hover { background: var(--bg-secondary); }
        .tree-item.selected { background: var(--bg-secondary); outline: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="editor-pane" style="flex-basis:100%">
            <div class="editor-toolbar">
                <div class="editor-title" id="editor-title">Markdown 编辑器</div>
                <div class="editor-actions">
                    <button id="btn-back" class="edit-btn" title="返回预览">⟵ 返回</button>
                    <button id="btn-save" class="edit-btn" title="保存 (Cmd/Ctrl+S)">💾 保存</button>
                    <button id="btn-save-as" class="edit-btn" title="另存为">📝 另存为</button>
                    <div id="saveas-modal" class="modal-backdrop">
                        <div class="modal">
                            <div class="modal-header">另存为</div>
                            <div class="modal-body">
                                <div class="tree-pane">
                                    <div id="saveas-tree"></div>
                                </div>
                                <div class="form-pane">
                                    <label for="saveas-dir">目标目录</label>
                                    <input id="saveas-dir" type="text" placeholder="例如：docs/notes" />
                                    <label for="saveas-name">文件名</label>
                                    <input id="saveas-name" type="text" placeholder="例如：new-file.md" />
                                    <small>仅支持 .md/.markdown/.mdown/.mkd/.mkdn</small>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button id="saveas-cancel" class="edit-btn">取消</button>
                                <button id="saveas-confirm" class="edit-btn">保存</button>
                            </div>
                        </div>
                    </div>
                    <div id="override-modal" class="modal-backdrop">
                        <div class="modal">
                            <div class="modal-header">并发冲突</div>
                            <div class="modal-body">
                                <p>检测到文件已被其他会话修改。是否覆盖保存？</p>
                            </div>
                            <div class="modal-footer">
                                <button id="override-cancel" class="edit-btn">取消</button>
                                <button id="override-confirm" class="edit-btn">覆盖保存</button>
                            </div>
                        </div>
                    </div>
                    <button id="btn-bold" class="edit-btn" title="加粗 (Cmd/Ctrl+B)">B</button>
                    <button id="btn-italic" class="edit-btn" title="斜体 (Cmd/Ctrl+I)"><i>I</i></button>
                    <button id="btn-underline" class="edit-btn" title="下划线 (Cmd/Ctrl+U)"><u>U</u></button>
                    <button id="btn-strike" class="edit-btn" title="删除线"><s>S</s></button>
                    <button id="btn-inline-code" class="edit-btn" title="行内代码">`code`</button>
                    <button id="btn-code-block" class="edit-btn" title="代码块">{ }</button>
                    <div class="edit-btn-group">
                        <button id="btn-h1" class="edit-btn" title="标题1 (Cmd/Ctrl+1)">H1</button>
                        <button id="btn-h2" class="edit-btn" title="H2 (Cmd/Ctrl+2)">H2</button>
                        <button id="btn-h3" class="edit-btn" title="H3 (Cmd/Ctrl+3)">H3</button>
                        <button id="btn-h4" class="edit-btn" title="H4 (Cmd/Ctrl+4)">H4</button>
                        <button id="btn-h5" class="edit-btn" title="H5 (Cmd/Ctrl+5)">H5</button>
                        <button id="btn-h6" class="edit-btn" title="H6 (Cmd/Ctrl+6)">H6</button>
                    </div>
                    <div class="edit-btn-group">
                        <button id="btn-quote" class="edit-btn" title="引用">❝</button>
                        <button id="btn-ul" class="edit-btn" title="无序列表">• List</button>
                        <button id="btn-ol" class="edit-btn" title="有序列表">1. List</button>
                        <button id="btn-task" class="edit-btn" title="任务列表">☑ Task</button>
                    </div>
                    <button id="btn-link" class="edit-btn" title="插入链接 (Cmd/Ctrl+K)">🔗 链接</button>
                    <button id="btn-image-url" class="edit-btn" title="插入图片链接">🖼 图片</button>
                    <input id="image-file-input" class="hidden" type="file" accept="image/*">
                    <div class="edit-btn-group table-picker-wrap">
                        <button id="btn-table" class="edit-btn" title="插入表格">▦ 表格</button>
                        <div id="table-popover" class="editor-popover">
                            <div id="table-grid" class="table-grid"></div>
                            <div id="table-size-label" class="table-size-label">选择表格大小</div>
                        </div>
                    </div>
                    <button id="btn-mermaid" class="edit-btn" title="插入 Mermaid 图表">📊 Mermaid</button>
                    <button id="btn-find" class="edit-btn" title="查找替换 (Cmd/Ctrl+F)">🔎 查找</button>
                    <div class="edit-btn-group">
                        <button id="btn-export-md" class="edit-btn" title="导出 Markdown">导出 MD</button>
                        <button id="btn-export-html" class="edit-btn" title="导出 HTML">HTML</button>
                        <button id="btn-export-word" class="edit-btn" title="导出 Word">Word</button>
                        <button id="btn-export-pdf" class="edit-btn" title="打印为 PDF">PDF</button>
                    </div>
                    <button id="btn-toggle-preview" class="edit-btn" title="切换预览">🔁 预览开关</button>
                </div>
            </div>
            <div class="editor-main">
                <div class="editor-pane left">
                    <div class="split-title">编辑区</div>
                    <textarea id="editor-textarea" class="editor-textarea" placeholder="在此输入 Markdown 内容..."></textarea>
                    <div class="status-bar" id="status">就绪</div>
                </div>
                <div class="preview-pane" id="preview-pane">
                    <div class="split-title">预览区</div>
                    <div class="preview-body" id="preview-body"></div>
                    <div class="status-bar">实时渲染 · Mermaid / Prism 支持</div>
                </div>
            </div>
        </div>
    </div>

    <div id="find-modal" class="modal-backdrop">
        <div class="modal modal-sm">
            <div class="modal-header">查找替换</div>
            <div class="modal-body modal-body-column">
                <label for="find-query">查找</label>
                <input id="find-query" type="text" placeholder="输入要查找的内容">
                <label for="find-replacement">替换为</label>
                <input id="find-replacement" type="text" placeholder="输入替换内容">
                <label class="checkbox-line"><input id="find-case" type="checkbox"> 区分大小写</label>
            </div>
            <div class="modal-footer">
                <button id="find-close" class="edit-btn">关闭</button>
                <button id="find-next" class="edit-btn">查找下一个</button>
                <button id="replace-one" class="edit-btn">替换</button>
                <button id="replace-all" class="edit-btn">全部替换</button>
            </div>
        </div>
    </div>

    <div id="mermaid-modal" class="modal-backdrop">
        <div class="modal modal-sm">
            <div class="modal-header">插入 Mermaid 图表</div>
            <div class="modal-body modal-body-column">
                <label for="mermaid-type">图表类型</label>
                <select id="mermaid-type">
                    <option value="mindmap">思维导图</option>
                    <option value="flowchart">流程图</option>
                </select>
                <label for="mermaid-code">Mermaid 源码</label>
                <textarea id="mermaid-code" rows="10" placeholder="flowchart TD&#10;    A[开始] --> B[结束]"></textarea>
            </div>
            <div class="modal-footer">
                <button id="mermaid-cancel" class="edit-btn">取消</button>
                <button id="mermaid-confirm" class="edit-btn">插入</button>
            </div>
        </div>
    </div>

    <div id="drop-overlay" class="drop-overlay">拖放 Markdown 文件或图片到这里</div>

    <script src="js/vendor/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="js/vendor/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="js/vendor/mermaid/10.6.1/mermaid.min.js"></script>
    <script src="js/vendor/marked/9.1.6/marked.min.js"></script>
    <script src="js/vendor/katex/0.16.9/katex.min.js"></script>
    <script src="js/vendor/katex/0.16.9/contrib/auto-render.min.js"></script>
    <script src="js/markdownMath.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/fileTree.js"></script>
    <script src="js/editorCommands.js"></script>
    <script src="js/editorHistory.js"></script>
    <script src="js/editorExport.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
<!-- AIGC END -->
